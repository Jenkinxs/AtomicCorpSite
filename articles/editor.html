<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Article · The Atomic Corporation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --theme-hue: 240;
  --theme-bg-saturation: 60%;
  --theme-bg-lightness: 3%;
  --theme-panel-saturation: 22%;
  --theme-panel-lightness: 10%;
  --theme-accent-saturation: 18%;
  --theme-accent-lightness: 78%;
  --theme-text-saturation: 0%;
  --theme-text-lightness: 83%;

  --bg: hsl(var(--theme-hue) var(--theme-bg-saturation) var(--theme-bg-lightness));
  --panel: hsla(var(--theme-hue) var(--theme-panel-saturation) var(--theme-panel-lightness) / 0.70);
  --panel-strong: hsla(var(--theme-hue) var(--theme-panel-saturation) calc(var(--theme-panel-lightness) + 1%) / 0.95);
  --panel-soft: hsla(var(--theme-hue) var(--theme-panel-saturation) calc(var(--theme-panel-lightness) + 2%) / 0.45);
  --surface-hover: hsla(var(--theme-hue) var(--theme-accent-saturation) calc(var(--theme-accent-lightness) + 10%) / 0.06);
  --surface-soft: hsla(var(--theme-hue) var(--theme-accent-saturation) calc(var(--theme-accent-lightness) + 12%) / 0.04);
  --border: hsla(var(--theme-hue) var(--theme-accent-saturation) var(--theme-accent-lightness) / 0.13);
  --border-hover: hsla(var(--theme-hue) var(--theme-accent-saturation) calc(var(--theme-accent-lightness) + 8%) / 0.28);
  --cream: hsl(var(--theme-hue) var(--theme-text-saturation) var(--theme-text-lightness));
  --cream-dim: hsla(var(--theme-hue) calc(var(--theme-text-saturation) - 4%) calc(var(--theme-text-lightness) - 1%) / 0.55);
  --cream-muted: hsla(var(--theme-hue) calc(var(--theme-text-saturation) - 8%) calc(var(--theme-text-lightness) - 3%) / 0.32);
  --white: hsl(var(--theme-hue) calc(var(--theme-text-saturation) - 21%) calc(var(--theme-text-lightness) + 13%));
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --accent: #a88ccf;
  --input-border: hsla(var(--theme-hue) var(--theme-accent-saturation) calc(var(--theme-accent-lightness) + 6%) / 0.14);
  --input-bg: hsla(var(--theme-hue) var(--theme-bg-saturation) calc(var(--theme-bg-lightness) + 3%) / 0.65);
}

html, body { height: 100%; }

body {
  font-family: var(--serif);
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  background-color: var(--bg);
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('../images/7Plague.jpg');
  background-position: bottom;
  background-size: cover;
  opacity: 0.12;
  z-index: -1;
}

.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 60px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.nav-bar a {
  text-decoration: none;
  color: var(--cream-dim);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: color 0.15s;
}

.nav-bar a:hover { color: var(--cream); }

/* ── EDITOR ── */
.editor-wrapper {
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 28px;
}

.editor-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

.editor-header h1 {
  font-family: var(--serif);
  font-size: clamp(24px, 3.5vw, 36px);
  font-weight: 700;
  color: var(--white);
  margin-bottom: 8px;
}

.editor-header p {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 300;
  font-style: italic;
  color: var(--cream-dim);
}

.form-group {
  display: grid;
  gap: 8px;
  margin-bottom: 22px;
}

.form-group label {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--cream-muted);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--cream);
  font-family: var(--serif);
  font-size: 15px;
  transition: border-color 0.15s;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.form-group textarea {
  resize: vertical;
  min-height: 80px;
}

.form-group textarea#content {
  min-height: 380px;
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.6;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.editor-actions {
  display: flex;
  gap: 14px;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  align-items: center;
}

.btn-primary {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cream);
  background: hsla(var(--theme-hue) var(--theme-accent-saturation) calc(var(--theme-accent-lightness) + 8%) / 0.1);
  border: 1px solid var(--accent);
  padding: 12px 32px;
  cursor: pointer;
  transition: all 0.18s;
}

.btn-primary:hover {
  background: hsla(var(--theme-hue) var(--theme-accent-saturation) calc(var(--theme-accent-lightness) + 8%) / 0.2);
  border-color: var(--cream-dim);
}

.btn-secondary {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cream-dim);
  background: none;
  border: 1px solid var(--border);
  padding: 12px 32px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.18s;
}

.btn-secondary:hover {
  border-color: var(--border-hover);
  color: var(--cream);
  background: var(--surface-soft);
}

.editor-status {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--cream-muted);
  margin-left: auto;
  letter-spacing: 0.1em;
}

.editor-status.success { color: #8fbf7a; }
.editor-status.error { color: #bf7a7a; }

/* ── PREVIEW ── */
.preview-toggle {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--cream-muted);
  cursor: pointer;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 0.5px;
  transition: color 0.15s;
}

.preview-toggle:hover { color: var(--cream); }

.preview-pane {
  display: none;
  border: 1px solid var(--border);
  padding: 24px;
  margin-bottom: 22px;
  background: var(--panel-soft);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.8;
  color: var(--cream-dim);
}

.preview-pane.active { display: block; }

.preview-pane h1, .preview-pane h2, .preview-pane h3 {
  color: var(--cream);
  font-weight: 600;
  margin-top: 1.2em;
  margin-bottom: 0.5em;
}

.preview-pane pre {
  background: var(--panel);
  padding: 12px 16px;
  border: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 13px;
  overflow-x: auto;
}

.preview-pane code {
  font-family: var(--mono);
  font-size: 13px;
  background: var(--surface-soft);
  padding: 1px 4px;
}

.preview-pane blockquote {
  border-left: 2px solid var(--accent);
  padding-left: 16px;
  margin: 1em 0;
  font-style: italic;
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .form-row { grid-template-columns: 1fr; }
  .editor-wrapper { padding: 24px 16px; }
  .editor-actions { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="/articles/">&larr; Articles</a>
  <span class="nav-bar-title" style="font-family:'Bodoni Moda',serif;font-size:16px;color:var(--cream);letter-spacing:0.07em;text-transform:uppercase;">New Article</span>
  <span></span>
</div>

<div class="editor-wrapper">
  <div class="editor-header">
    <h1>Write</h1>
    <p>Compose in markdown. Publish to the site.</p>
  </div>

  <form id="article-form" onsubmit="return false;">
    <div class="form-row">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Article title" required>
      </div>
      <div class="form-group">
        <label for="tags">Tags (comma-separated)</label>
        <input type="text" id="tags" name="tags" placeholder="tech, philosophy, writing">
      </div>
    </div>

    <div class="form-group">
      <label for="summary">Summary</label>
      <textarea id="summary" name="summary" placeholder="A short blurb for the listing page"></textarea>
    </div>

    <div class="form-group" style="position:relative;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <label for="content">Article Body (Markdown)</label>
        <span class="preview-toggle" id="preview-toggle">Preview</span>
      </div>
      <textarea id="content" name="content" placeholder="Write your article in markdown..."></textarea>
    </div>

    <div class="preview-pane" id="preview-pane"></div>

    <div class="editor-actions">
      <button class="btn-primary" id="save-btn" type="button">Publish Article</button>
      <a class="btn-secondary" href="index.html">Cancel</a>
      <span class="editor-status" id="editor-status"></span>
    </div>
  </form>
</div>

<script>
// Lightweight markdown → HTML for preview
function renderPreview(md) {
  let h = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  h = h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g, '<em><strong>$1</strong></em>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/`{3}(\w*)\n?([\s\S]*?)`{3}/g, '<pre><code>$2</code></pre>');
  h = h.replace(/^&gt;\s?(.*)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  h = h.replace(/^---+\s*$/gm, '<hr>');
  return h;
}

// ── Preview toggle ──
const previewToggle = document.getElementById('preview-toggle');
const previewPane = document.getElementById('preview-pane');
const contentArea = document.getElementById('content');

previewToggle.addEventListener('click', () => {
  if (previewPane.classList.contains('active')) {
    previewPane.classList.remove('active');
    previewToggle.textContent = 'Preview';
  } else {
    previewPane.innerHTML = renderPreview(contentArea.value) || '<p style="color:var(--cream-muted);font-style:italic;">Nothing to preview.</p>';
    previewPane.classList.add('active');
    previewToggle.textContent = 'Hide Preview';
  }
});

// ── Save article ──
const saveBtn = document.getElementById('save-btn');
const statusEl = document.getElementById('editor-status');

function slugify(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'untitled';
}

saveBtn.addEventListener('click', async () => {
  const title = document.getElementById('title').value.trim();
  const summary = document.getElementById('summary').value.trim();
  const tagsRaw = document.getElementById('tags').value.trim();
  const content = contentArea.value.trim();

  if (!title || !content) {
    statusEl.textContent = 'Title and content are required.';
    statusEl.className = 'editor-status error';
    return;
  }

  const article = {
    id: slugify(title) + '-' + Date.now().toString(36),
    title,
    date: new Date().toISOString().split('T')[0],
    tags: tagsRaw ? tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : [],
    summary,
    content
  };

  statusEl.textContent = 'Saving...';
  statusEl.className = 'editor-status';

  // Try the FastAPI backend first
  try {
    const resp = await fetch('/api/articles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(article)
    });
    if (resp.ok) {
      statusEl.textContent = 'Article published!';
      statusEl.className = 'editor-status success';
      setTimeout(() => { window.location.href = 'article.html?id=' + encodeURIComponent(article.id); }, 800);
      return;
    }
    throw new Error('API not available');
  } catch (e) {
    // Fallback: save to a downloadable JSON blob
    // Also save to localStorage so it persists in-browser
    try {
      const existing = JSON.parse(localStorage.getItem('ac_articles') || '[]');
      existing.push(article);
      localStorage.setItem('ac_articles', JSON.stringify(existing));
    } catch (e) { /* localStorage may be full */ }

    // Offer as download
    const blob = new Blob([JSON.stringify(article, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = article.id + '.json';
    a.click();
    URL.revokeObjectURL(a.href);

    statusEl.textContent = 'Saved. Downloaded as ' + a.download + '. Run build.py to add to site.';
    statusEl.className = 'editor-status success';
  }
});
</script>
</body>
</html>
