<script src="../assets/site.js"></script>
<script>
(function () {
    var ledger = document.getElementById("ledger");
    var count = document.getElementById("count");

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function shortDate(iso) {
        var d = new Date(iso);
        if (isNaN(d)) return iso || "";
        var p = function (n) { return String(n).padStart(2, "0"); };
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }

    function render(list) {
        ledger.removeAttribute("aria-busy");
        if (!list || !list.length) {
            ledger.innerHTML = '<p class="empty">No entries yet.</p>';
            count.textContent = "0 entries";
            return;
        }
        list.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
        ledger.innerHTML = list.map(function (a) {
            var tags = (a.tags || []).join(" \u00b7 ");
            return '<a class="ledger-item" href="article.html?id=' + encodeURIComponent(a.id) + '">' +
                '<span class="date">' + esc(shortDate(a.date)) + (tags ? "<br>" + esc(tags) : "") + "</span>" +
                "<span>" +
                '<span class="title">' + esc(a.title) + "</span>" +
                '<span class="sum">' + esc(a.summary || "") + "</span>" +
                "</span>" +
                '<span class="arrow" aria-hidden="true">&rarr;</span>' +
                "</a>";
        }).join("");
        count.textContent = list.length + (list.length === 1 ? " entry" : " entries");
    }

    fetch("/api/articles")
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(render)
        .catch(function () {
            return fetch("data/articles.json")
                .then(function (r) { if (!r.ok) throw 0; return r.json(); })
                .then(render)
                .catch(function () {
                    ledger.removeAttribute("aria-busy");
                    ledger.innerHTML = '<p class="empty">Could not load the manifest.</p>';
                    count.textContent = "";
                });
        });
})();
</script>
</body>
