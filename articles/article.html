<script src="../assets/site.js"></script>
<script>
(function () {
    var titleEl = document.getElementById("title");
    var metaEl = document.getElementById("meta");
    var bodyEl = document.getElementById("article");
    var fallbackEl = document.getElementById("fallback");
    var id = new URLSearchParams(window.location.search).get("id");

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function markdown(md) {
        var fences = [];
        var src = String(md).replace(/```(\w*)\r?\n([\s\S]*?)```/g, function (m, lang, code) {
            fences.push(code.replace(/\n$/, ""));
            return "\u0001FENCE" + (fences.length - 1) + "\u0001";
        });

        var html = esc(src);
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*\*(.+?)\*\*\*/g, "<em><strong>$1</strong></em>");
        html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
        html = html.replace(/^---+$/gm, "<hr>");
        html = html.replace(/^&gt;\s?(.*)$/gm, function (m, c) { return c ? "<blockquote><p>" + c + "</p></blockquote>" : ""; });
        html = html.replace(/^#### (.+)$/gm, "<h4>$1</h4>");
        html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
        html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
        html = html.replace(/^# (.+)$/gm, "<h2>$1</h2>");
        html = html.replace(/(?:^|\n)((?:[ \t]*\d+\.[ \t]+.+\r?\n?)+)/g, function (m, block) {
            var items = block.trim().split(/\r?\n/).map(function (l) {
                return "<li>" + l.replace(/^[ \t]*\d+\.[ \t]+/, "") + "</li>";
            }).join("");
            return "\n<ol>" + items + "</ol>\n";
        });

        html = html.replace(/(?:^|\n)((?:[ \t]*[-*][ \t]+.+\r?\n?)+)/g, function (m, block) {
            var items = block.trim().split(/\r?\n/).map(function (l) {
                return "<li>" + l.replace(/^[ \t]*[-*][ \t]+/, "") + "</li>";
            }).join("");
            return "\n<ul>" + items + "</ul>\n";
        });

        html = html.replace(/\u0001FENCE(\d+)\u0001/g, '<pre data-fence="$1"></pre>');

        var out = [];
        html.split("\n").forEach(function (line) {
            var t = line.trim();
            var block = /^<(h[1-4]|ul|ol|li|blockquote|pre|hr|img|table)/.test(t) ||
                /^<\/(ul|ol|blockquote|pre)>/.test(t) ||
                t === "" || /^<li>/.test(t);
            out.push(block ? line : "<p>" + t + "</p>");
        });

        return out.join("\n").replace(/<pre data-fence="(\d+)"><\/pre>/g, function (m, i) {
            return "<pre><code>" + esc(fences[Number(i)]) + "</code></pre>";
        });
    }

    function longDate(iso) {
        var d = new Date(iso);
        if (isNaN(d)) return iso || "";
        return d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    function show(article) {
        document.title = article.title + " — The Atomic Corporation";
        titleEl.textContent = article.title;
        var tags = (article.tags || []).join(" \u00b7 ");
        metaEl.innerHTML = "<span>" + esc(longDate(article.date)) + "</span>" +
            "<span>Entry</span>" +
            (tags ? '<span class="tags">' + esc(tags) + "</span>" : "");
        metaEl.hidden = false;
        bodyEl.innerHTML = markdown(article.content || "");
    }

    function fail(msg) {
        titleEl.textContent = "Not found";
        fallbackEl.hidden = false;
        fallbackEl.innerHTML = msg + ' <a href="./" style="border-bottom:1px solid var(--accent)">Back to all entries</a>.';
    }

    if (!id) {
        fail("No entry specified.");
        return;
    }

    fetch("/api/articles/" + encodeURIComponent(id))
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(show)
        .catch(function () {
            return fetch("data/articles.json")
                .then(function (r) { if (!r.ok) throw 0; return r.json(); })
                .then(function (list) {
                    var found = (list || []).filter(function (a) { return a.id === id; })[0];
                    if (!found) throw 0;
                    show(found);
                })
                .catch(function () { fail("That entry does not exist in the manifest."); });
        });
})();
</script>
</body>
</html>
