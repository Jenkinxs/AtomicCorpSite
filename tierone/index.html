<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Fabrication — Incident Response Portal</title>
<style>
:root {
  --bg: #0e1116;
  --panel: #161b22;
  --line: #252d38;
  --text: #dfe6ef;
  --muted: #8b9bad;
  --accent: #d8a657;
  --accent-dim: #7a5c2e;
  --error: #e06c75;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}

.frame { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

.masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
  margin-bottom: 32px;
}

.brand { display: flex; gap: 16px; align-items: center; }

.mark {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.06em;
}

h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.badge {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 4px 10px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 24px;
  margin-bottom: 18px;
}

.login { max-width: 460px; }
.muted { color: var(--muted); font-size: 13.5px; }
.foot { color: var(--muted); font-size: 12px; margin: 18px 0 0; }

label {
  display: block;
  margin: 16px 0 6px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

input {
  width: 100%;
  padding: 11px 12px;
  background: #0d1117;
  border: 1px solid var(--line);
  color: var(--text);
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  font-size: 14px;
}

input:focus { outline: none; border-color: var(--accent-dim); }

button {
  margin-top: 20px;
  width: 100%;
  padding: 11px;
  background: var(--accent);
  border: 0;
  color: #14181d;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

button:disabled { opacity: 0.55; cursor: default; }

.error { color: var(--error); font-size: 13px; margin: 14px 0 0; }

.head { border-left: 2px solid var(--accent); }

dl { margin: 0; }
dt {
  color: var(--accent);
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 18px;
}
dd { margin: 6px 0 0; }

ul { margin: 8px 0 0; padding-left: 18px; }
li { margin-bottom: 8px; }

.mono {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  font-size: 13px;
  background: #0d1117;
  border: 1px solid var(--line);
  padding: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}

.tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 2px 7px;
  margin-right: 8px;
}

</style>
</head>
<body>
<div class="frame">
  <header class="masthead">
    <div class="brand">
      <span class="mark">NW</span>
      <div>
        <h1>Incident Response Portal</h1>
        <p class="sub">Northwind Fabrication &middot; Case IR-2026-1114-NW7</p>
      </div>
    </div>
    <span class="badge">Confidential</span>
  </header>

  <section id="login" class="card login">
    <h2>Retained counsel access</h2>
    <p class="muted">Credentials were issued by the service desk and recorded in the case ticket.</p>
    <form id="login-form" autocomplete="off">
      <label for="user">Username</label>
      <input id="user" name="user" type="text" spellcheck="false" placeholder="ir-username">
      <label for="pass">Password</label>
      <input id="pass" name="pass" type="password" placeholder="temporary credential">
      <button type="submit" id="submit">Unlock case file</button>
      <p id="error" class="error" hidden></p>
    </form>
    <p class="foot">Access is logged. Case contents are sealed with a key derived from the issued credential.</p>
  </section>

  <section id="case" hidden>
    <div class="card head">
      <h2 id="case-title"></h2>
      <p id="case-meta" class="muted"></p>
      <p id="case-summary"></p>
    </div>
    <div id="sections"></div>
  </section>
</div>

<script>
const encoder = new TextEncoder();
const decoder = new TextDecoder();

function from_b64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
}

function read_bundle() {
    const node = document.getElementById("case-bundle");
    if (!node) {
        throw new Error("case archive unavailable");
    }
    return JSON.parse(node.textContent);
}

async function decrypt_bundle(password) {
    const bundle = read_bundle();
    const material = await crypto.subtle.importKey(
        "raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: from_b64(bundle.salt),
            iterations: bundle.iterations,
            hash: "SHA-256",
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
    );
    const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: from_b64(bundle.nonce) },
        key,
        from_b64(bundle.ciphertext)
    );
    return JSON.parse(decoder.decode(plaintext));
}

function card() {
    const element = document.createElement("div");
    element.className = "card";
    return element;
}

function heading(text) {
    const element = document.createElement("h2");
    element.textContent = text;
    return element;
}

function list(items) {
    const element = document.createElement("ul");
    for (const item of items) {
        const entry = document.createElement("li");
        entry.textContent = item;
        element.appendChild(entry);
    }
    return element;
}

function render(data) {
    document.getElementById("case-title").textContent = data.customer;
    document.getElementById("case-meta").textContent =
        `${data.case_id} · ${data.prepared_by} · ${data.classification}`;
    document.getElementById("case-summary").textContent = data.summary;

    const container = document.getElementById("sections");
    container.textContent = "";

    const statement = card();
    statement.appendChild(heading("Customer statement"));
    statement.appendChild(list(data.customer_statement));
    container.appendChild(statement);

    const observations = card();
    observations.appendChild(heading("Analyst observations"));
    observations.appendChild(list(data.analyst_observations));
    container.appendChild(observations);

    const hosts = card();
    hosts.appendChild(heading("Host notes"));
    const dl = document.createElement("dl");
    for (const note of data.host_notes) {
        const term = document.createElement("dt");
        term.textContent = note.host;
        const detail = document.createElement("dd");
        detail.textContent = note.finding;
        dl.appendChild(term);
        dl.appendChild(detail);
    }
    hosts.appendChild(dl);
    container.appendChild(hosts);

    const corrections = card();
    corrections.appendChild(heading("Sequence corrections"));
    corrections.appendChild(list(data.sequence_corrections));
    container.appendChild(corrections);

    const questions = card();
    questions.appendChild(heading("Open questions"));
    questions.appendChild(list(data.open_questions));
    container.appendChild(questions);

    const handling = card();
    handling.appendChild(heading("Evidence handling"));
    const policy = document.createElement("p");
    policy.textContent = data.handling;
    handling.appendChild(policy);
    container.appendChild(handling);

    const archive = card();
    archive.appendChild(heading("Archived evidence"));
    for (const [alertId, record] of Object.entries(data.archived_evidence)) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = alertId;
        archive.appendChild(tag);
        const title = document.createElement("strong");
        title.textContent = record.title;
        archive.appendChild(title);
        const body = document.createElement("div");
        body.className = "mono";
        body.textContent = record.body;
        archive.appendChild(body);
        const meta = document.createElement("p");
        meta.className = "muted";
        meta.textContent = `Archived ${record.archived_at} by ${record.archived_by} · host ${record.host}`;
        archive.appendChild(meta);
    }
    container.appendChild(archive);

    const next = card();
    next.appendChild(heading("Next steps"));
    const nextText = document.createElement("p");
    nextText.textContent = data.next_steps;
    next.appendChild(nextText);
    container.appendChild(next);
}

document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = document.getElementById("submit");
    const error = document.getElementById("error");
    const username = document.getElementById("user").value.trim().toLowerCase();
    const password = document.getElementById("pass").value;

    error.hidden = true;
    button.disabled = true;
    button.textContent = "Deriving key…";

    try {
        const data = await decrypt_bundle(password);
        if (username !== "ir-northwind") {
            throw new Error("unknown principal");
        }
        render(data);
        document.getElementById("login").hidden = true;
        document.getElementById("case").hidden = false;
    } catch (failure) {
        error.textContent = "Access denied. Credential rejected or archive unavailable.";
        error.hidden = false;
        button.disabled = false;
        button.textContent = "Unlock case file";
    }
});

</script>
</body>
</html>
